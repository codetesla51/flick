<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>flick · flag console</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
        mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
      },
      colors: {
        bg: 'var(--bg)',
        raised: 'var(--raised)',
        recessed: 'var(--recessed)',
        hover: 'var(--hover)',
        ink: 'var(--ink)',
        secondary: 'var(--secondary)',
        muted: 'var(--muted)',
        blue: 'var(--blue)',
        red: 'var(--red)',
        amber: 'var(--amber)',
        green: 'var(--green)',
      },
    },
  },
};
</script>
<style>
  /* ---- Design tokens (achromatic; blue is the only interactive accent) ---- */
  :root {
    --bg: #FAFAFA;
    --raised: #FFFFFF;
    --recessed: #F2F2F2;
    --hover: #EBEBEB;
    --ink: #171717;
    --secondary: #4D4D4D;
    --muted: #8F8F8F;
    --blue: #0072F5;
    --blue-focus: #005FCC;
    --red: #E5484D;
    --amber: #FF990A;
    --green: #45A557;
    /* shadow-as-border + elevation layers */
    --bd: 0 0 0 1px rgb(0 0 0 / 0.08);
    --shadow-sm: 0px 2px 2px rgb(0 0 0 / 0.04);
    --shadow-md: 0px 2px 2px rgb(0 0 0 / 0.04), 0px 8px 8px -8px rgb(0 0 0 / 0.04);
    --shadow-pop: 0px 1px 1px rgb(0 0 0 / 0.02), 0px 8px 16px -4px rgb(0 0 0 / 0.04), 0px 24px 32px -8px rgb(0 0 0 / 0.06);
    --shadow-menu: 0px 1px 1px rgb(0 0 0 / 0.02), 0px 4px 8px -4px rgb(0 0 0 / 0.04), 0px 16px 24px -8px rgb(0 0 0 / 0.06);
    /* double-ring focus: white gap + blue indicator */
    --ring: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--blue);
    --ease: cubic-bezier(.175, .885, .32, 1.1);
  }
  .dark {
    --bg: #0A0A0A;
    --raised: #111111;
    --recessed: #1A1A1A;
    --hover: #1F1F1F;
    --ink: #EDEDED;
    --secondary: #A0A0A0;
    --muted: #6F6F6F;
    --blue: #0070F3;
    --blue-focus: #3291FF;
    --red: #EB5757;
    --amber: #FF990A;
    --green: #50B962;
    --bd: 0 0 0 1px rgb(255 255 255 / 0.12);
    --shadow-sm: 0px 2px 2px rgb(0 0 0 / 0.4);
    --shadow-md: 0px 2px 2px rgb(0 0 0 / 0.4), 0px 8px 8px -8px rgb(0 0 0 / 0.4);
    --shadow-pop: 0px 1px 1px rgb(0 0 0 / 0.3), 0px 8px 16px -4px rgb(0 0 0 / 0.4), 0px 24px 32px -8px rgb(0 0 0 / 0.6);
    --shadow-menu: 0px 1px 1px rgb(0 0 0 / 0.3), 0px 4px 8px -4px rgb(0 0 0 / 0.4), 0px 16px 24px -8px rgb(0 0 0 / 0.6);
    --ring: 0 0 0 2px #0A0A0A, 0 0 0 4px var(--blue);
  }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { background: var(--bg); color: var(--ink); font-feature-settings: 'liga'; }
  ::selection { background: rgb(0 114 245 / 0.18); }
  button { cursor: pointer; }
  button:disabled { cursor: default; }

  /* ---- surfaces: shadow-as-border, never CSS border ---- */
  .card { background: var(--raised); border-radius: 12px; box-shadow: var(--bd); }
  .card-hover { transition: box-shadow .15s ease; }
  .card-hover:hover { box-shadow: var(--bd), var(--shadow-sm); }
  .bd { box-shadow: var(--bd); }
  .bd-menu { box-shadow: var(--bd), var(--shadow-menu); }
  .bd-pop { box-shadow: var(--bd), var(--shadow-pop); }

  /* ---- buttons: ghost-first, color-only interactions ---- */
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--secondary);
    border-radius: 6px;
    transition: background-color .12s ease, color .12s ease;
  }
  .btn-ghost:hover { background: var(--hover); color: var(--ink); }
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ink); color: var(--bg);
    border-radius: 6px; font-weight: 500;
    transition: background-color .12s ease;
  }
  .btn-primary:hover { background: color-mix(in srgb, var(--ink) 82%, transparent); }

  /* ---- inputs: transparent, shadow border, focus outline ---- */
  .input {
    height: 40px; width: 100%; background: transparent;
    border-radius: 6px; box-shadow: var(--bd);
    font-size: 14px; color: var(--ink);
    transition: box-shadow .12s ease;
  }
  .input-sm { height: 36px; }
  .input::placeholder { color: var(--muted); }
  .input:focus, .ta:focus { outline: 1px solid var(--blue-focus); outline-offset: 0; box-shadow: none; }
  .ta {
    width: 100%; background: transparent; border-radius: 6px; box-shadow: var(--bd);
    font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: var(--ink);
    resize: vertical; line-height: 1.6;
  }

  /* ---- double-ring focus pattern ---- */
  .focus-ring:focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--ring); }

  /* ---- header ---- */
  .header {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 0 rgb(0 0 0 / 0.08);
  }
  .dark .header { box-shadow: 0 1px 0 0 rgb(255 255 255 / 0.1); }

  /* ---- motion: swift easing, restrained ---- */
  @keyframes modal-in { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
  .modal-in { animation: modal-in .3s var(--ease); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
  .toast-in { animation: toast-in .2s var(--ease); }
  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  .fade-in { animation: fade-in .2s ease; }
  summary::-webkit-details-marker { display: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body class="font-sans min-h-screen">

<!-- ============ HEADER (64px, hairline shadow, blur) ============ -->
<header class="header">
  <div class="mx-auto max-w-[1200px] px-6 h-16 flex items-center gap-8">
    <a href="/" class="flex items-center gap-2.5 focus-ring rounded-md">
      <span class="text-[15px] font-semibold tracking-[-0.02em]">flick</span>
    </a>

    <div class="ml-auto flex items-center gap-1">
      <span class="hidden sm:flex items-center px-3 h-8 text-[13px] text-secondary" title="Live sync status">
        <span id="liveText">connecting…</span>
      </span>
      <button id="themeBtn" class="btn-ghost h-8 w-8 focus-ring" aria-label="Toggle theme">
        <i id="themeIcon" class="ph ph-moon text-base"></i>
      </button>
      <button id="newBtn" class="btn-primary h-8 px-3.5 gap-1.5 text-[13px] focus-ring ml-1">
        <i class="ph ph-plus text-sm"></i><span class="hidden sm:inline">New flag</span>
      </button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-[1200px] px-6 pb-24 pt-8">

  <!-- ============ METRICS (achromatic cards, values only) ============ -->
  <section aria-label="Live metrics" class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-8">
    <div class="card px-5 py-4">
      <div class="flex items-center justify-between">
        <span class="text-[12px] font-medium text-secondary">Flags</span>
        <i class="ph ph-flag text-sm text-muted"></i>
      </div>
      <div class="mt-1.5 font-mono text-[26px] font-semibold tabular-nums tracking-[-0.02em]" id="mFlags">–</div>
    </div>
    <div class="card px-5 py-4">
      <div class="flex items-center justify-between">
        <span class="text-[12px] font-medium text-secondary">Delivered</span>
        <i class="ph ph-paper-plane-tilt text-sm text-muted"></i>
      </div>
      <div class="mt-1.5 font-mono text-[26px] font-semibold tabular-nums tracking-[-0.02em]" id="mDelivered">–</div>
    </div>
    <div class="card px-5 py-4">
      <div class="flex items-center justify-between">
        <span class="text-[12px] font-medium text-secondary">WAL lag</span>
        <i class="ph ph-gauge text-sm text-muted"></i>
      </div>
      <div class="mt-1.5 font-mono text-[26px] font-semibold tabular-nums tracking-[-0.02em]" id="mLag">–</div>
    </div>
    <div class="card px-5 py-4">
      <div class="flex items-center justify-between">
        <span class="text-[12px] font-medium text-secondary">Changes</span>
        <i class="ph ph-lightning text-sm text-muted"></i>
      </div>
      <div class="mt-1.5 font-mono text-[26px] font-semibold tabular-nums tracking-[-0.02em]" id="mChanges">–</div>
    </div>
  </section>

  <!-- ============ FLAGS ============ -->
  <section>
    <div class="flex items-center gap-3 mb-4">
      <h2 class="text-[15px] font-medium tracking-[-0.02em]">Flags</h2>
      <span id="flagCount" class="text-[12px] text-muted font-mono"></span>
      <div class="relative ml-auto w-full max-w-[240px]">
        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-sm text-muted pointer-events-none"></i>
        <input id="search" type="search" placeholder="Search flags…" autocomplete="off" class="input pl-9" />
      </div>
    </div>

    <div id="listHeader" class="hidden md:grid grid-cols-[minmax(0,1.5fr)_150px_130px_120px_110px_96px] gap-3 px-6 pb-2 text-[12px] font-medium text-secondary">
      <span>Flag</span><span>Default</span><span>Variants</span><span>Targeting</span><span>Updated</span><span class="text-right">State</span>
    </div>
    <div id="flags" class="flex flex-col gap-2"></div>

    <div id="pager" class="flex items-center justify-between gap-3 mt-5"></div>

    <div id="empty" class="hidden px-6 py-20 text-center">
      <span class="inline-grid place-items-center h-12 w-12 rounded-xl bg-recessed text-muted"><i class="ph ph-flag text-xl"></i></span>
      <p class="mt-4 text-sm font-medium">No flags yet</p>
      <p class="mt-1.5 text-[13px] text-secondary max-w-sm mx-auto">Create your first flag and it syncs to every connected flagd client within milliseconds.</p>
      <button id="emptyNew" class="btn-primary mt-6 h-9 px-4 gap-1.5 text-[13px] focus-ring">
        <i class="ph ph-plus text-sm"></i> Create your first flag
      </button>
    </div>
  </section>

  <!-- last event line -->
  <footer class="mt-12 text-[12px] text-muted flex items-center gap-2">
    <i class="ph ph-activity text-sm"></i>
    <span id="lastEvent">last event: —</span>
  </footer>
</main>

<!-- ============ FLAG MODAL ============ -->
<div id="modalBackdrop" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-[rgb(23_23_23/0.4)] dark:bg-black/60 fade-in" id="modalScrim"></div>
  <div class="absolute inset-x-0 bottom-0 md:inset-0 md:grid md:place-items-center p-0 md:p-6 overflow-y-auto">
    <div id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
      class="modal-in w-full md:max-w-lg rounded-t-xl md:rounded-xl bd-pop" style="background:var(--raised)">
      <div class="flex items-center justify-between pl-5 pr-3 h-14">
        <h2 id="modalTitle" class="text-[14px] font-semibold tracking-[-0.01em]">New flag</h2>
        <button id="modalClose" class="btn-ghost h-8 w-8 focus-ring" aria-label="Close"><i class="ph ph-x text-base"></i></button>
      </div>

      <form id="flagForm" class="px-5 pb-5 space-y-4" novalidate>
        <div>
          <label for="fKey" class="block text-[13px] font-medium text-secondary mb-1.5">Key</label>
          <input id="fKey" required class="input font-mono" placeholder="show-banner" autocomplete="off" />
          <p id="fKeyErr" class="hidden mt-1.5 text-[12px] text-red"></p>
        </div>

        <div>
          <span class="block text-[13px] font-medium text-secondary mb-1.5">State</span>
          <div class="grid grid-cols-2 gap-1 p-1 rounded-md bg-recessed w-fit">
            <button type="button" data-state="ENABLED" class="stateSeg h-8 px-4 rounded-[5px] text-[13px] font-medium focus-ring transition-colors">Enabled</button>
            <button type="button" data-state="DISABLED" class="stateSeg h-8 px-4 rounded-[5px] text-[13px] font-medium focus-ring transition-colors">Disabled</button>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[13px] font-medium text-secondary">Variants</span>
            <button type="button" id="addVariant" class="btn-ghost h-7 px-2 gap-1 text-[12px] font-medium focus-ring">
              <i class="ph ph-plus text-sm"></i> Add variant
            </button>
          </div>
          <div id="variantRows" class="space-y-2"></div>
          <p id="fVariantsErr" class="hidden mt-1.5 text-[12px] text-red"></p>
        </div>

        <div>
          <label for="fDefault" class="block text-[13px] font-medium text-secondary mb-1.5">Default variant</label>
          <select id="fDefault" class="input font-mono px-2"></select>
        </div>

        <details class="group">
          <summary class="btn-ghost h-8 px-2 gap-1 text-[13px] font-medium select-none" style="width:fit-content">
            Targeting &amp; metadata <i class="ph ph-caret-down text-sm transition-transform group-open:rotate-180"></i>
          </summary>
          <div class="mt-3 space-y-3">
            <div>
              <label for="fTargeting" class="block text-[12px] font-medium text-muted mb-1">targeting <span class="font-normal">(JSON)</span></label>
              <textarea id="fTargeting" rows="3" spellcheck="false" class="ta p-2.5">{"country":["NG"]}</textarea>
            </div>
            <div>
              <label for="fMetadata" class="block text-[12px] font-medium text-muted mb-1">metadata <span class="font-normal">(JSON)</span></label>
              <textarea id="fMetadata" rows="2" spellcheck="false" class="ta p-2.5">{"owner":"platform"}</textarea>
            </div>
          </div>
        </details>

        <p id="fFormErr" class="hidden text-[12px] text-red"></p>

        <div class="flex items-center justify-end gap-2 pt-4">
          <button type="button" id="modalCancel" class="btn-ghost h-9 px-4 text-[13px] focus-ring">Cancel</button>
          <button type="submit" class="btn-primary h-9 px-4 text-[13px] focus-ring">Save flag</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ============ TOASTS ============ -->
<div id="toasts" class="fixed top-16 right-4 z-50 flex flex-col gap-2 items-end pointer-events-none"></div>

<script>
"use strict";

/* ---------- theme ---------- */
const stored = localStorage.getItem("flick-theme");
const param = new URLSearchParams(location.search).get("theme");
const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
const setTheme = (dark) => {
  document.documentElement.classList.toggle("dark", dark);
  document.getElementById("themeIcon").className = "ph text-base " + (dark ? "ph-sun" : "ph-moon");
  localStorage.setItem("flick-theme", dark ? "dark" : "light");
};
setTheme(param ? param === "dark" : stored ? stored === "dark" : prefersDark);
document.getElementById("themeBtn").addEventListener("click", () =>
  setTheme(!document.documentElement.classList.contains("dark")));

/* ---------- state ---------- */
let flags = [];
let lastEvent = null;

const $ = (id) => document.getElementById(id);
const listEl = $("flags"), emptyEl = $("empty"), searchEl = $("search");

/* ---------- api ---------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.error || "request failed (" + res.status + ")");
  return data;
}
const refreshFlags = async () => {
  try {
    const data = await api("/api/flags");
    flags = data.flags || [];
    $("mFlags").textContent = flags.length;
    render();
  } catch (err) { toast("Failed to load flags: " + err.message, "bad"); }
};

/* ---------- render ---------- */
// API returns variants/targeting/metadata as JSON objects; tolerate the
// old string form too.
const obj = (x) => (typeof x === "string" ? JSON.parse(x) : x || {});
function variantCount(v) {
  try { return Object.keys(obj(v)).length; } catch (_) { return 0; }
}
function hasTargeting(t) {
  try { return Object.keys(obj(t)).length > 0; } catch (_) { return false; }
}
function fmtTime(t) {
  const d = new Date(t);
  const diff = Date.now() - d.getTime();
  if (diff < 60_000) return "just now";
  if (diff < 3_600_000) return Math.floor(diff / 60000) + "m ago";
  if (diff < 86_400_000) return Math.floor(diff / 3600000) + "h ago";
  return d.toLocaleDateString();
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const switchHTML = (f, label) => `
  <button data-act="toggle" role="switch" aria-checked="${f.state === "ENABLED"}" aria-label="Toggle ${esc(f.key)}"
    class="inline-flex items-center gap-2.5 h-8 px-2 rounded-md transition-colors focus-ring cursor-pointer">
    <span class="relative h-[18px] w-8 rounded-full transition-colors ${f.state === "ENABLED" ? "bg-blue" : "bg-recessed bd"}" style="flex:none">
      <span class="absolute top-[1px] h-4 w-4 rounded-full transition-all ${f.state === "ENABLED" ? "left-[14px]" : "left-[1px]"} knob" style="background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/.08),0 1px 2px rgb(0 0 0/.18)"></span>
    </span>
    <span class="text-[13px] font-medium ${f.state === "ENABLED" ? "text-ink" : "text-secondary"}">${label}</span>
  </button>`;

function rowHTML(f) {
  const targeting = hasTargeting(f.targeting);
  const on = f.state === "ENABLED";
  return `
  <div data-key="${esc(f.key)}" class="card card-hover">
    <div class="px-6 py-3.5 md:grid md:grid-cols-[minmax(0,1.5fr)_150px_130px_120px_110px_96px] md:gap-3 md:items-center">
      <div class="flex items-center gap-3 min-w-0">
        <span class="size-2.5 rounded-full ${on ? "bg-green" : "bg-muted"}" aria-hidden="true"></span>
        <div class="min-w-0">
          <p class="font-mono text-[13px] font-medium truncate">${esc(f.key)}</p>
          <p class="text-[11px] text-muted md:hidden mt-0.5">${variantCount(f.variants)} variants · default ${esc(f.defaultVariant)}</p>
        </div>
        <div class="ml-auto flex items-center gap-1.5 md:hidden">
          <span class="text-[11px] font-medium ${on ? "text-green" : "text-muted"}">${f.state}</span>
        </div>
      </div>

      <span class="hidden md:block truncate font-mono text-[12px] text-secondary">${esc(f.defaultVariant)}</span>
      <span class="hidden md:block font-mono text-[12px] text-muted">${variantCount(f.variants)}</span>
      <span class="hidden md:block">
        ${targeting ? `<span class="inline-flex items-center gap-1.5 text-[12px] text-secondary" title="Has targeting rules"><span class="size-2.5 rounded-full bg-blue"></span>targeted</span>` : '<span class="text-[12px] text-muted/60">—</span>'}
      </span>
      <span class="hidden md:block text-[12px] text-muted">${fmtTime(f.updatedAt)}</span>

      <div class="hidden md:flex justify-end">
        ${switchHTML(f, on ? "Enabled" : "Disabled")}
      </div>

      <div class="md:hidden flex items-center gap-2 mt-2.5">
        ${switchHTML(f, on ? "Enabled" : "Disabled")}
      </div>
    </div>
    <div class="md:hidden flex items-center gap-1 px-6 pb-3 -mt-0.5 pl-[44px]">
      <button data-act="edit" class="btn-ghost h-8 px-2.5 gap-1 text-[12px] font-medium focus-ring"><i class="ph ph-pencil-simple text-sm"></i> Edit</button>
      <button data-act="delMobile" class="btn-ghost h-8 px-2.5 gap-1 text-[12px] font-medium focus-ring hover:text-red"><i class="ph ph-trash text-sm"></i> Delete</button>
    </div>
    <div class="hidden md:flex items-center gap-0.5 px-6 pb-3 justify-end">
      <button data-act="edit" class="btn-ghost h-8 w-8 focus-ring" aria-label="Edit ${esc(f.key)}"><i class="ph ph-pencil-simple text-sm"></i></button>
      <span class="relative">
        <button data-act="delete" class="btn-ghost h-8 w-8 focus-ring hover:text-red" aria-label="Delete ${esc(f.key)}"><i class="ph ph-trash text-sm"></i></button>
        <span data-confirm class="hidden absolute right-0 top-9 z-10 rounded-lg bd-menu p-1" style="background:var(--raised)">
          <button data-act="confirmDelete" class="h-8 px-3 rounded-md text-[13px] font-medium text-red hover:bg-recessed focus-ring">Delete</button>
          <button data-act="cancelDelete" class="h-8 w-8 grid place-items-center rounded-md text-muted hover:bg-recessed focus-ring" aria-label="Cancel"><i class="ph ph-x text-sm"></i></button>
        </span>
      </span>
    </div>
  </div>`;
}

/* ---------- pagination ---------- */
const PAGE_SIZE = 6;
let page = 1;
const pagerEl = $("pager");

function renderPager(filtered) {
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (page > pages) page = pages;
  if (filtered.length <= PAGE_SIZE) { pagerEl.innerHTML = ""; return; }
  const from = (page - 1) * PAGE_SIZE + 1;
  const to = Math.min(page * PAGE_SIZE, filtered.length);
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (pages > 7 && i !== 1 && i !== pages && Math.abs(i - page) > 1) {
      if (nums[nums.length - 1] !== "…") nums.push("…");
      continue;
    }
    nums.push(i);
  }
  const numBtns = nums.map((n) => n === "…"
    ? `<span class="px-1 text-muted">…</span>`
    : `<button data-pg="${n}" aria-label="Page ${n}" class="h-7 min-w-7 px-1.5 rounded-md text-[12px] font-mono focus-ring transition-colors ${n === page ? "bg-ink text-bg font-medium" : "text-secondary hover:bg-hover hover:text-ink"}">${n}</button>`).join("");
  pagerEl.innerHTML = `
    <span class="text-[12px] text-muted font-mono">${from}–${to} of ${filtered.length}</span>
    <div class="flex items-center gap-1">
      <button data-pg="${page - 1}" ${page === 1 ? "disabled" : ""} aria-label="Previous page"
        class="h-7 w-7 grid place-items-center rounded-md text-secondary hover:bg-hover hover:text-ink transition-colors focus-ring disabled:opacity-35 disabled:hover:bg-transparent"><i class="ph ph-caret-left text-sm"></i></button>
      ${numBtns}
      <button data-pg="${page + 1}" ${page === pages ? "disabled" : ""} aria-label="Next page"
        class="h-7 w-7 grid place-items-center rounded-md text-secondary hover:bg-hover hover:text-ink transition-colors focus-ring disabled:opacity-35 disabled:hover:bg-transparent"><i class="ph ph-caret-right text-sm"></i></button>
    </div>`;
}

function render() {
  emptyEl.classList.toggle("hidden", flags.length > 0);
  $("flagCount").textContent = flags.length ? flags.length + " total" : "";
  const q = searchEl.value.trim().toLowerCase();
  const filtered = q ? flags.filter((f) => f.key.toLowerCase().includes(q)) : flags;
  const slice = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  listEl.innerHTML = slice.map(rowHTML).join("") ||
    `<div class="px-6 py-14 text-center text-[13px] text-muted">No flags match “${esc(q)}”</div>`;
  listEl.classList.toggle("hidden", flags.length === 0);
  renderPager(filtered);
}

pagerEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-pg]");
  if (!btn || btn.disabled) return;
  page = Number(btn.dataset.pg);
  render();
});
searchEl.addEventListener("input", () => { page = 1; render(); });

/* ---------- actions ---------- */
let pendingDelete = null;
listEl.addEventListener("click", async (e) => {
  try {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const row = btn.closest("[data-key]");
    const key = row ? row.dataset.key : null;
    if (!row || !key) return;
    const act = btn.dataset.act;

    if (act === "toggle") return doToggle(row, key);
    if (act === "edit") return openModal(key);
    if (act === "delete") {
      // Hide any already-open confirm popover.
      if (pendingDelete) pendingDelete.querySelector("[data-confirm]")?.classList.add("hidden");
      pendingDelete = row;
      const confirmEl = row.querySelector("[data-confirm]");
      if (confirmEl) { confirmEl.classList.remove("hidden"); return; }
      // Fallback (shouldn't happen): no popover in this row → ask natively.
      if (window.confirm("Delete " + key + "?")) return doDelete(key);
      return;
    }
    if (act === "delMobile") {
      if (btn.dataset.armed) return doDelete(key);
      btn.dataset.armed = "1";
      btn.classList.add("bg-recessed");
      btn.innerHTML = '<i class="ph ph-check text-sm"></i> Delete?';
      setTimeout(() => render(), 2500);
      return;
    }
    if (act === "confirmDelete") return doDelete(key);
    if (act === "cancelDelete") {
      row.querySelector("[data-confirm]")?.classList.add("hidden");
      if (pendingDelete === row) pendingDelete = null;
    }
  } catch (err) {
    toast("Action failed: " + err.message, "bad");
  }
});

async function doToggle(row, key) {
  const f = flags.find((x) => x.key === key);
  if (!f) return;
  const next = f.state === "ENABLED" ? "DISABLED" : "ENABLED";
  const old = f.state;
  // optimistic
  f.state = next;
  render();
  toast((next === "ENABLED" ? "Enabled " : "Disabled ") + key);
  try {
    await api("/api/flags", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, state: next, defaultVariant: f.defaultVariant, variants: obj(f.variants), targeting: obj(f.targeting), metadata: obj(f.metadata) }),
    });
  } catch (err) {
    f.state = old; render();
    toast("Toggle failed: " + err.message, "bad");
  }
}

async function doDelete(key) {
  try {
    await api("/api/flags/" + encodeURIComponent(key), { method: "DELETE" });
    toast("Deleted " + key);
    await refreshFlags();
  } catch (err) { toast("Delete failed: " + err.message, "bad"); }
}

/* ---------- modal ---------- */
const modal = $("modalBackdrop");
let editingKey = null;
let formState = "ENABLED";

function openModal(key) {
  try {
    editingKey = key || null;
    $("modalTitle").textContent = key ? "Edit flag" : "New flag";
    $("fKey").readOnly = !!key;
    $("fKey").classList.toggle("opacity-60", !!key);
    formState = "ENABLED";
    if (key) {
      const f = flags.find((x) => x.key === key);
      if (!f) { toast("Flag not found: " + key, "bad"); return; }
      formState = f.state;
      $("fKey").value = f.key;
      $("fTargeting").value = JSON.stringify(obj(f.targeting), null, 2);
      $("fMetadata").value = JSON.stringify(obj(f.metadata), null, 2);
      setVariantRows(Object.entries(obj(f.variants)));
    } else {
      $("fKey").value = "";
      $("fTargeting").value = "{}";
      $("fMetadata").value = "{\n  \"owner\": \"platform\"\n}";
      setVariantRows([["on", true], ["off", false]]);
    }
    paintStateSeg();
    hideErrors();
    modal.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    setTimeout(() => $("fKey").focus(), 30);
  } catch (err) {
    toast("Couldn't open editor: " + err.message, "bad");
  }
}
function closeModal() {
  modal.classList.add("hidden");
  document.body.style.overflow = "";
}
$("modalClose").addEventListener("click", closeModal);
$("modalCancel").addEventListener("click", closeModal);
$("modalScrim").addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.classList.contains("hidden")) closeModal(); });

function paintStateSeg() {
  document.querySelectorAll(".stateSeg").forEach((b) => {
    const on = b.dataset.state === formState;
    b.className = "stateSeg h-8 px-4 rounded-[5px] text-[13px] font-medium focus-ring transition-colors cursor-pointer " +
      (on ? "bg-raised bd text-ink" : "text-secondary hover:text-ink");
  });
}
document.querySelectorAll(".stateSeg").forEach((b) =>
  b.addEventListener("click", () => { formState = b.dataset.state; paintStateSeg(); }));

function setVariantRows(pairs) {
  const wrap = $("variantRows");
  wrap.innerHTML = "";
  for (const [k, v] of pairs) wrap.appendChild(variantRow(k, v));
  paintDefaultSelect();
}
function variantRow(name, value) {
  const div = document.createElement("div");
  div.className = "flex gap-1.5";
  const v = typeof value === "string" ? value : JSON.stringify(value);
  div.innerHTML = `
    <input data-v name spellcheck="false" value="${esc(name)}" placeholder="variant"
      class="input input-sm flex-1 font-mono px-2.5" />
    <input data-val val spellcheck="false" value="${esc(v)}" placeholder="value (JSON)"
      class="input input-sm flex-[1.4] font-mono px-2.5" />
    <button type="button" data-rm class="btn-ghost h-9 w-9 shrink-0 focus-ring hover:text-red" aria-label="Remove variant"><i class="ph ph-minus text-base"></i></button>`;
  div.querySelector("[data-rm]").addEventListener("click", () => {
    div.remove(); paintDefaultSelect();
  });
  div.querySelectorAll("input").forEach((i) => i.addEventListener("input", paintDefaultSelect));
  return div;
}
$("addVariant").addEventListener("click", () => {
  $("variantRows").appendChild(variantRow("", ""));
  $("variantRows").lastChild.querySelector("input[data-v]").focus();
});

function variantPairs() {
  const out = [];
  document.querySelectorAll("#variantRows > div").forEach((row) => {
    const name = row.querySelector("[data-v]").value.trim();
    const val = row.querySelector("[data-val]").value.trim();
    if (name) out.push([name, val]);
  });
  return out;
}
function paintDefaultSelect() {
  const sel = $("fDefault");
  const prev = sel.value;
  const names = variantPairs().map(([n]) => n);
  sel.innerHTML = names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (names.includes(prev)) sel.value = prev;
}

function hideErrors() {
  ["fKeyErr", "fVariantsErr", "fFormErr"].forEach((id) => $(id).classList.add("hidden"));
}
function fieldErr(id, msg) {
  const el = $(id); el.textContent = msg; el.classList.remove("hidden");
}

$("flagForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideErrors();
  const key = $("fKey").value.trim();
  const pairs = variantPairs();
  if (!key) return fieldErr("fKeyErr", "A key is required — e.g. show-banner");
  if (!pairs.length) return fieldErr("fVariantsErr", "Add at least one variant.");

  const variants = {};
  for (const [name, raw] of pairs) {
    let val;
    try { val = raw === "" ? null : JSON.parse(raw); } catch (_) {
      return fieldErr("fVariantsErr", `Value for “${name}” is not valid JSON.`);
    }
    variants[name] = val;
  }
  let targeting, metadata;
  try { targeting = JSON.parse($("fTargeting").value || "{}"); } catch (_) {
    return fieldErr("fFormErr", "targeting is not valid JSON.");
  }
  try { metadata = JSON.parse($("fMetadata").value || "{}"); } catch (_) {
    return fieldErr("fFormErr", "metadata is not valid JSON.");
  }
  const defaultVariant = $("fDefault").value;
  if (!defaultVariant || !(defaultVariant in variants))
    return fieldErr("fVariantsErr", "Default variant must be one of the variants.");

  const btn = e.submitter;
  const label = btn.textContent;
  btn.disabled = true; btn.classList.add("opacity-50");
  try {
    await api("/api/flags", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, state: formState, defaultVariant, variants, targeting, metadata }),
    });
    toast((editingKey ? "Updated " : "Created ") + key);
    closeModal();
    await refreshFlags();
  } catch (err) {
    fieldErr("fFormErr", err.message);
  } finally {
    btn.disabled = false; btn.classList.remove("opacity-50");
    if (label) btn.textContent = label;
  }
});

/* ---------- toasts (dot + text, achromatic) ---------- */
function toast(msg, tone = "good") {
  const el = document.createElement("div");
  el.className = "toast-in pointer-events-auto flex items-center gap-2.5 rounded-lg bd-menu px-3.5 py-2.5 text-[13px]";
  el.style.background = "var(--raised)";
  el.innerHTML = `<span class="size-2.5 rounded-full ${tone === "good" ? "bg-green" : "bg-red"}"></span>${esc(msg)}`;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ---------- live ---------- */
let refreshPending = false;
const scheduleRefresh = () => {
  if (refreshPending) return;
  refreshPending = true;
  setTimeout(() => { refreshPending = false; refreshFlags(); }, 150);
};

const evt = new EventSource("/events");
evt.onopen = () => {
  $("liveText").textContent = "streaming";
};
evt.onerror = () => {
  $("liveText").textContent = "reconnecting";
};
evt.onmessage = (msg) => {
  try {
    const c = JSON.parse(msg.data);
    if (c.Table === "outbox" && c.Operation === "insert") {
      const raw = c.NewRow && c.NewRow.payload;
      let p = {};
      if (raw) p = (typeof raw === "string") ? JSON.parse(raw) : raw;
      if (p.key) {
        $("lastEvent").textContent = `last event: ${c.Table} — ${p.key} ${p.deleted ? "(deleted)" : p.state || ""}`.trim();
        scheduleRefresh();
      }
    }
  } catch (_) {}
};

const mstream = new EventSource("/metrics/stream");
mstream.onmessage = (msg) => {
  try {
    const m = JSON.parse(msg.data);
    $("mDelivered").textContent = m.outbox_delivered;
    $("mChanges").textContent = m.changes_processed;
    $("mLag").textContent = m.replication_lag_bytes > 0 ? (m.replication_lag_bytes / 1024).toFixed(1) + " KB" : "0 B";
  } catch (_) {}
};

$("newBtn").addEventListener("click", () => openModal(null));
$("emptyNew").addEventListener("click", () => openModal(null));

refreshFlags();
</script>
</body>
</html>
